name: Validate

# File-validity checks only: lint, type-check, syntax/config validation.
# No unit tests, no build/deploy — see mvp.md §13 for the fuller pipeline
# planned for later.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Syntax/import check
        run: python -m compileall -q app

  frontend-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, frontend-mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q
